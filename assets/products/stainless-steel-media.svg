<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Stainless Steel Media</title>
  <desc id="desc">Ball / Pin / Satellite</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edf2f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10241d" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="720" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="94" cy="78" r="58" fill="#a0aec0" opacity=".18"/>
  <circle cx="626" cy="92" r="88" fill="#4a5568" opacity=".08"/>
  <g filter="url(#shadow)">
    
    <rect x="245" y="160" width="230" height="184" rx="32" fill="#edf2f7" stroke="#4a5568" stroke-width="12"/>
    <circle cx="360" cy="252" r="62" fill="#a0aec0"/>
  
  </g>
  <rect x="54" y="398" width="612" height="72" rx="20" fill="#ffffff" opacity=".92"/>
  <text x="84" y="430" fill="#14342b" font-family="Arial, sans-serif" font-size="28" font-weight="700">Stainless Steel Media</text>
  <text x="84" y="458" fill="#64746d" font-family="Arial, sans-serif" font-size="18">Ball / Pin / Satellite</text>
  <text x="635" y="454" text-anchor="end" fill="#4a5568" font-family="Arial, sans-serif" font-size="20" font-weight="700">RPV</text>
</svg>
