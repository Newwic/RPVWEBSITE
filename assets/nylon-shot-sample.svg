<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Nylon Shot red media sample">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff624d"/>
      <stop offset=".45" stop-color="#f21f18"/>
      <stop offset="1" stop-color="#ff8a5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#7a100c" flood-opacity=".28"/>
    </filter>
    <pattern id="pellets" width="86" height="86" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <rect width="86" height="86" fill="url(#bg)"/>
      <g filter="url(#shadow)">
        <rect x="5" y="8" width="25" height="22" rx="4" fill="#ff4632"/>
        <rect x="38" y="4" width="28" height="24" rx="4" fill="#f32a20"/>
        <rect x="18" y="42" width="31" height="25" rx="5" fill="#ff7050"/>
        <rect x="57" y="48" width="23" height="24" rx="4" fill="#e91e18"/>
      </g>
      <path d="M10 14h16M42 11h18M23 49h20M61 54h14" stroke="#ffb5a2" stroke-width="4" stroke-linecap="round" opacity=".72"/>
      <path d="M8 30h21M38 28h29M19 67h30M58 72h22" stroke="#b90f0d" stroke-width="3" stroke-linecap="round" opacity=".22"/>
    </pattern>
    <radialGradient id="shine" cx="36%" cy="24%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".08"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#pellets)"/>
  <rect width="1200" height="900" fill="url(#shine)"/>
</svg>
